<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Validation Sheet Builder</title>

  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">

  <style>
    * {
      font-family: 'Poppins';
    }

    body {
      margin: 2em;
    }

    label {
      font-size: 20px;
      font-weight: bold;
    }

    input {
      margin: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin: 3px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 13px;
    }

    .selected {
      background-color: #E60000;
      color: white;
    }

    .section {
      margin-bottom: 2em;
    }

    details {
      margin-bottom: 12px;
      padding-left: 0;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 8px;
      margin-left: 0;
    }

    .button-group {
      margin-left: 0;
      padding-left: 0;
    }
  </style>
</head>

<body>

  <div class="section">
    <label>Partner Name:</label>
    <input id="partnerName" type="text" placeholder="Enter partner name..." />
  </div>

  <div id="sections"></div>

  <button id="exportBtn" style="background-color: #E60000; color: white;">
    Create Validation Sheet
  </button>

  <button id="onboardingBtn" style="background-color: #222; color: white;">
    Create Onboarding Sheet
  </button>

  <script>

    const hostedOptions = [
      'Token (Keyed)',
      'Vault (Keyed)',
      'Cryptogram (Keyed)',
      'Token (Swipe)',
      'Vault (Swipe)',
      'Cryptogram (Swipe)'
    ];

    const embeddedOptions = [
      'Embedded Sale',
      'Embedded Token'
    ];

    const walletOptions = [
      'Apple Pay',
      'Google Pay',
      'Paypal',
      'Paze',
      'Chariot'
    ];

    const apiGroups = {

      Payments: [
        'Create Payment',
        'Authorize Payment',
        'Refund Payment',
        'Cancel Payment',
        'Complete Payment',
        'Search Payment',
        'Create Payment Link'
      ],

      EMV: [
        'Create EMV Payment',
        'Create EMV Refund',
        'EMV Device Status'
      ],

      Subscriptions: [
        'Create Subscription',
        'Modify Subscription'
      ],

      PaymentMethods: [
        'Create Payment Method',
        'Modify Payment Method',
        'Generate Token',
        'AVS Check',
        'Check Surcharge'
      ],

      Customers: [
        'Create Customer',
        'Get Customer',
        'Modify Customer'
      ],

      Batches: [
        'Close Batch'
      ],

      Reports: [
        'Retrieve Report'
      ],

      Invoices: [
        'Create Invoice',
        'Get Invoice',
        'Modify Invoice Status',
        'Modify Invoice Details',
        'Search Invoice',
        'Share Invoice',
        'Clone Invoice',
        'Download Invoice',
        'Create Invoice Config',
        'Get Invoice Config',
        'Modify Invoice Config'
      ]
    };

    const onboardingOptions = [
      'Create Merchant',
      'Get Merchant',
      'Modify Merchant',
      'Board Merchant'
    ];

    const feeOptions = [
      'Partner Fee',
      'Surcharge'
    ];

    const webhookOptions = [
      'Merchant Loaded',
      'Merchant Updated',
      'Payment Processed',
      'CC Batch Processed',
      'ACH/EFT Batch Processed',
      'ACH/EFT Rejected',
      'CC Chargeback',
      'Vault'
    ];

    let hosted = [];
    let embedded = [];
    let wallets = [];
    let endpoints = [];

    function toggleSelection(arr, value) {
      const idx = arr.indexOf(value);

      if (idx === -1) {
        arr.push(value);
      } else {
        arr.splice(idx, 1);
      }
    }

    const sectionsData = [
      {
        title: 'Hosted Payment Form Options',
        options: hostedOptions,
        arr: hosted
      },

      {
        title: 'Embedded Payment Options',
        options: embeddedOptions,
        arr: embedded
      },

      {
        title: 'Digital Wallet Options',
        options: walletOptions,
        arr: wallets
      }
    ];

    const container = document.getElementById('sections');

    // STANDARD SECTIONS
    sectionsData.forEach(section => {

      const div = document.createElement('div');
      div.classList.add('section');

      const title = document.createElement('h3');
      title.textContent = section.title;

      div.appendChild(title);

      const buttonGroup = document.createElement('div');
      buttonGroup.classList.add('button-group');

      section.options.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {
          toggleSelection(section.arr, opt);
          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      div.appendChild(buttonGroup);

      container.appendChild(div);
    });

    // API ENDPOINT DROPDOWNS
    const apiDiv = document.createElement('div');
    apiDiv.classList.add('section');

    const apiTitle = document.createElement('h3');
    apiTitle.textContent = 'API Endpoints';

    apiDiv.appendChild(apiTitle);

    Object.entries(apiGroups).forEach(([groupName, groupOptions]) => {

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.textContent = groupName;

      details.appendChild(summary);

      const buttonGroup = document.createElement('div');
      buttonGroup.classList.add('button-group');

      groupOptions.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {
          toggleSelection(endpoints, opt);
          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      details.appendChild(buttonGroup);

      apiDiv.appendChild(details);
    });

    container.appendChild(apiDiv);

    // VALIDATION SHEET EXPORT
    document.getElementById('exportBtn').addEventListener('click', async () => {

      const partnerName = document
        .getElementById('partnerName')
        .value
        .trim();

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Validation Sheet');

      ws.columns = [
        { width: 30 },
        { width: 30 },
        { width: 30 }
      ];

      const headerStyle = {
        font: {
          bold: true,
          color: { argb: 'FFFFFFFF' }
        },

        fill: {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'E60000' }
        },

        alignment: {
          horizontal: 'center'
        }
      };

      const addSection = (header, arr, cols = 2) => {

        if (ws.lastRow) {
          ws.addRow([]);
        }

        const headerRow = ws.addRow(header);

        for (let i = 1; i <= header.length; i++) {

          const cell = headerRow.getCell(i);

          cell.font = headerStyle.font;
          cell.fill = headerStyle.fill;
          cell.alignment = headerStyle.alignment;
        }

        arr.forEach(v => {
          ws.addRow([
            v,
            ...(Array(cols - 1).fill(''))
          ]);
        });
      };

      if (hosted.length) {
        addSection(
          ['Hosted Payment Form', 'Response Data'],
          hosted
        );
      }

      if (embedded.length) {
        addSection(
          ['Embedded Payments', 'JWT', 'Response Data'],
          embedded,
          3
        );
      }

      if (wallets.length) {
        addSection(
          ['Digital Wallets', 'Response Data'],
          wallets
        );
      }

      if (endpoints.length) {
        addSection(
          ['API Endpoints', 'Request Data', 'Response Data'],
          endpoints,
          3
        );
      }

      addSection(
        ['Fee Type', 'Using? (Y/N)'],
        feeOptions
      );

      addSection(
        ['Webhook', 'Subscribed? (Y/N)'],
        webhookOptions
      );

      const buf = await wb.xlsx.writeBuffer();

      const blob = new Blob(
        [buf],
        {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
      );

      const fileName = partnerName
        ? `${partnerName.replaceAll(' ', '-')}-Validation-Sheet.xlsx`
        : 'Validation-Sheet.xlsx';

      saveAs(blob, fileName);
    });

    // ONBOARDING SHEET EXPORT
    document.getElementById('onboardingBtn').addEventListener('click', async () => {

      const partnerName = document
        .getElementById('partnerName')
        .value
        .trim();

      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Onboarding Sheet');

      ws.columns = [
        { width: 30 },
        { width: 30 },
        { width: 30 }
      ];

      const headerStyle = {
        font: {
          bold: true,
          color: { argb: 'FFFFFFFF' }
        },

        fill: {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'E60000' }
        },

        alignment: {
          horizontal: 'center'
        }
      };

      const headerRow = ws.addRow([
        'Onboarding Endpoint',
        'Request Data',
        'Response Data'
      ]);

      for (let i = 1; i <= 3; i++) {

        const cell = headerRow.getCell(i);

        cell.font = headerStyle.font;
        cell.fill = headerStyle.fill;
        cell.alignment = headerStyle.alignment;
      }

      onboardingOptions.forEach(v => {
        ws.addRow([v, '', '']);
      });

      const buf = await wb.xlsx.writeBuffer();

      const blob = new Blob(
        [buf],
        {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
      );

      const fileName = partnerName
        ? `${partnerName.replaceAll(' ', '-')}-Onboarding-Sheet.xlsx`
        : 'Onboarding-Sheet.xlsx';

      saveAs(blob, fileName);
    });

  </script>

</body>
</html>
