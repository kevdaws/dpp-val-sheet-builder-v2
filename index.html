<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Validation Sheet Builder</title>

  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">

  <style>
    * {
      font-family: 'Poppins';
    }

    body {
      margin: 2em;
      display: flex;
      gap: 1.2em;
      align-items: flex-start;
    }

    .main {
      flex: 0 0 68%;
    }

    .panel {
      width: 260px;
      border-left: 1px solid #ddd;
      padding-left: 14px;
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    label {
      font-size: 20px;
      font-weight: bold;
    }

    input {
      margin: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin: 3px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 13px;
    }

    .selected {
      background-color: #E60000;
      color: white;
    }

    details {
      margin-bottom: 12px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .button-group {
      margin-top: 8px;
    }

    ul {
      padding-left: 18px;
      font-size: 13px;
      margin-top: 6px;
    }

    .panel-section {
      margin-bottom: 14px;
    }

    .panel-title {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }
  </style>
</head>

<body>

  <div class="main">

    <div class="section">
      <label>Partner Name:</label>
      <input id="partnerName" type="text" placeholder="Enter partner name..." />
    </div>

    <div id="sections"></div>

    <button id="exportBtn" style="background-color: #E60000; color: white;">
      Create Validation Sheet
    </button>

    <button id="onboardingBtn" style="background-color: #222; color: white;">
      Create Onboarding Sheet
    </button>

  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h3>Current Selections</h3>

    <div id="hostedWrap" class="panel-section">
      <span class="panel-title" id="hostedTitle">Hosted</span>
      <ul id="sel-hosted"></ul>
    </div>

    <div id="embeddedWrap" class="panel-section">
      <span class="panel-title" id="embeddedTitle">Embedded</span>
      <ul id="sel-embedded"></ul>
    </div>

    <div id="walletWrap" class="panel-section">
      <span class="panel-title" id="walletTitle">Wallets</span>
      <ul id="sel-wallets"></ul>
    </div>

    <div id="apiWrap" class="panel-section">
      <span class="panel-title" id="apiTitle">API</span>
      <ul id="sel-api"></ul>
    </div>
  </div>

  <script>

    const hostedOptions = [
      'Token (Keyed)',
      'Vault (Keyed)',
      'Cryptogram (Keyed)',
      'Token (Swipe)',
      'Vault (Swipe)',
      'Cryptogram (Swipe)'
    ];

    const embeddedOptions = [
      'Embedded Sale',
      'Embedded Token'
    ];

    const walletOptions = [
      'Apple Pay',
      'Google Pay',
      'Paypal',
      'Paze',
      'Chariot'
    ];

    const apiGroups = {

      Payments: [
        'Create Payment',
        'Authorize Payment',
        'Refund Payment',
        'Cancel Payment',
        'Complete Payment',
        'Search Payment',
        'Create Payment Link'
      ],

      EMV: [
        'Create EMV Payment',
        'Create EMV Refund',
        'EMV Device Status'
      ],

      Subscriptions: [
        'Create Subscription',
        'Modify Subscription'
      ],

      PaymentMethods: [
        'Create Payment Method',
        'Modify Payment Method',
        'Generate Token',
        'AVS Check',
        'Check Surcharge'
      ],

      Customers: [
        'Create Customer',
        'Get Customer',
        'Modify Customer'
      ],

      Batches: [
        'Close Batch'
      ],

      Reports: [
        'Retrieve Report'
      ],

      Invoices: [
        'Create Invoice',
        'Get Invoice',
        'Modify Invoice Status',
        'Modify Invoice Details',
        'Search Invoice',
        'Share Invoice',
        'Clone Invoice',
        'Download Invoice',
        'Create Invoice Config',
        'Get Invoice Config',
        'Modify Invoice Config'
      ]
    };

    let hosted = [];
    let embedded = [];
    let wallets = [];
    let endpoints = [];

    function toggleSelection(arr, value) {
      const idx = arr.indexOf(value);
      if (idx === -1) arr.push(value);
      else arr.splice(idx, 1);
      renderSelections();
    }

    function setVisibility(titleId, list) {
      const el = document.getElementById(titleId);
      el.style.display = list.length ? 'block' : 'none';
    }

    function renderSelections() {

      document.getElementById('sel-hosted').innerHTML =
        hosted.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-embedded').innerHTML =
        embedded.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-wallets').innerHTML =
        wallets.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-api').innerHTML =
        endpoints.map(v => `<li>${v}</li>`).join('');

      // hide headers when empty
      setVisibility('hostedTitle', hosted);
      setVisibility('embeddedTitle', embedded);
      setVisibility('walletTitle', wallets);
      setVisibility('apiTitle', endpoints);
    }

    const container = document.getElementById('sections');

    function buildSection(title, options, arr) {

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.textContent = title;

      details.appendChild(summary);

      const buttonGroup = document.createElement('div');
      buttonGroup.classList.add('button-group');

      options.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {
          toggleSelection(arr, opt);
          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      details.appendChild(buttonGroup);
      container.appendChild(details);
    }

    buildSection('Hosted Payment Form Options', hostedOptions, hosted);
    buildSection('Embedded Payment Options', embeddedOptions, embedded);
    buildSection('Digital Wallet Options', walletOptions, wallets);

    const apiDetails = document.createElement('details');
    apiDetails.open = true;

    const apiSummary = document.createElement('summary');
    apiSummary.textContent = 'API Endpoints';

    apiDetails.appendChild(apiSummary);

    const apiContainer = document.createElement('div');
    apiContainer.style.paddingLeft = '20px';

    Object.entries(apiGroups).forEach(([groupName, groupOptions]) => {

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.textContent = groupName;

      details.appendChild(summary);

      const buttonGroup = document.createElement('div');

      groupOptions.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {
          toggleSelection(endpoints, opt);
          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      details.appendChild(buttonGroup);
      apiContainer.appendChild(details);
    });

    apiDetails.appendChild(apiContainer);
    container.appendChild(apiDetails);

    renderSelections();

  </script>

</body>
</html>
