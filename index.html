<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Validation Sheet Builder</title>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

  <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">

  <style>

    * {
      font-family: 'Poppins';
      box-sizing: border-box;
    }

    body {
      margin: 2em;
      display: flex;
      gap: 1.2em;
      align-items: flex-start;
      background: #fff;
    }

    .main {
      flex: 0 0 68%;
    }

    .panel {
      width: 260px;
      border-left: 1px solid #ddd;
      padding-left: 14px;
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .panel-section {
      margin-bottom: 14px;
    }

    .panel-title {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .section {
      margin-bottom: 1.5em;
    }

    .input-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 20px;
      font-weight: bold;
    }

    input {
      margin-top: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 300px;
    }

    button {
      margin: 3px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-size: 13px;
      background: white;
    }

    .selected {
      background-color: #E60000;
      color: white;
    }

    details {
      margin-bottom: 12px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .button-group {
      margin-top: 8px;
    }

    ul {
      padding-left: 18px;
      font-size: 13px;
      margin-top: 6px;
    }

    .action-buttons {
      margin-top: 24px;
    }

  </style>
</head>

<body>

  <!-- MAIN -->
  <div class="main">

    <div class="section">

      <div class="input-row">

        <div class="input-group">
          <label>Partner Name:</label>
          <input
            id="partnerName"
            type="text"
            placeholder="Enter partner name..."
          />
        </div>

        <div class="input-group">
          <label>Reviewer Name:</label>
          <input
            id="reviewerName"
            type="text"
            placeholder="Enter reviewer name..."
          />
        </div>

      </div>

    </div>

    <div id="sections"></div>

    <div class="action-buttons">

      <button
        id="exportBtn"
        style="background-color:#E60000;color:white;"
      >
        Create Validation Sheet
      </button>

      <button
        id="onboardingBtn"
        style="background-color:#222;color:white;"
      >
        Create Onboarding Sheet
      </button>

      <button
        id="letterBtn"
        style="background-color:#0066cc;color:white;"
      >
        Create Validation Letter
      </button>

    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">

    <h3>Current Selections</h3>

    <div class="panel-section">
      <span class="panel-title" id="hostedTitle">Hosted</span>
      <ul id="sel-hosted"></ul>
    </div>

    <div class="panel-section">
      <span class="panel-title" id="embeddedTitle">Embedded</span>
      <ul id="sel-embedded"></ul>
    </div>

    <div class="panel-section">
      <span class="panel-title" id="walletTitle">Wallets</span>
      <ul id="sel-wallets"></ul>
    </div>

    <div class="panel-section">
      <span class="panel-title" id="apiTitle">API</span>
      <ul id="sel-api"></ul>
    </div>

    <div class="panel-section">
      <span class="panel-title" id="webhookTitle">Webhooks</span>
      <ul id="sel-webhooks"></ul>
    </div>

  </div>

  <script>

    // =========================
    // OPTIONS
    // =========================

    const hostedOptions = [
      'Token (Keyed)',
      'Vault (Keyed)',
      'Cryptogram (Keyed)',
      'Token (Swipe)',
      'Vault (Swipe)',
      'Cryptogram (Swipe)'
    ];

    const embeddedOptions = [
      'Embedded Sale',
      'Embedded Token'
    ];

    const walletOptions = [
      'Apple Pay',
      'Google Pay',
      'Paypal',
      'Paze',
      'Chariot'
    ];

    const apiGroups = {

      Payments: [
        'Create Payment',
        'Authorize Payment',
        'Refund Payment',
        'Cancel Payment',
        'Complete Payment',
        'Search Payment',
        'Create Payment Link'
      ],

      EMV: [
        'Create EMV Payment',
        'Create EMV Refund',
        'EMV Device Status'
      ],

      Subscriptions: [
        'Create Subscription',
        'Modify Subscription'
      ],

      PaymentMethods: [
        'Create Payment Method',
        'Modify Payment Method',
        'Generate Token',
        'AVS Check',
        'Check Surcharge'
      ],

      Customers: [
        'Create Customer',
        'Get Customer',
        'Modify Customer'
      ],

      Batches: [
        'Close Batch'
      ],

      Reports: [
        'Retrieve Report'
      ],

      Invoices: [
        'Create Invoice',
        'Get Invoice',
        'Modify Invoice Status',
        'Modify Invoice Details',
        'Search Invoice',
        'Share Invoice',
        'Clone Invoice',
        'Download Invoice',
        'Create Invoice Config',
        'Get Invoice Config',
        'Modify Invoice Config'
      ]
    };

    const onboardingOptions = [
      'Get Partner Templates',
      'Get Partner Config',
      'Create Application',
      'Get Existing Application',
      'Download Application PDF',
      'Get Acceptance R&F',
      'Get Acceptance Language',
      'Initiate Identity Verification',
      'Submit Identity Verification',
      'Submit Merchant Decision',
      'Get Application Status',
      'Search SIC Codes'

    ];

    const feeOptions = [
      'Partner Fee',
      'Surcharge'
    ];

    const webhookOptions = [
      'Merchant Loaded',
      'Merchant Updated',
      'Payment Processed',
      'CC Batch Processed',
      'ACH/EFT Batch Processed',
      'ACH/EFT Rejected',
      'CC Chargeback',
      'Vault'
    ];

    // =========================
    // STATE
    // =========================

    let hosted = [];
    let embedded = [];
    let wallets = [];
    let endpoints = [];
    let webhooks = [];

    // =========================
    // HELPERS
    // =========================

    function toggleSelection(arr, value) {

      const idx = arr.indexOf(value);

      if (idx === -1) {
        arr.push(value);
      } else {
        arr.splice(idx, 1);
      }

      renderSelections();
    }

    function setVisibility(id, list) {

      document.getElementById(id).style.display =
        list.length ? 'block' : 'none';
    }

    function renderSelections() {

      document.getElementById('sel-hosted').innerHTML =
        hosted.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-embedded').innerHTML =
        embedded.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-wallets').innerHTML =
        wallets.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-api').innerHTML =
        endpoints.map(v => `<li>${v}</li>`).join('');

      document.getElementById('sel-webhooks').innerHTML =
        webhooks.map(v => `<li>${v}</li>`).join('');

      setVisibility('hostedTitle', hosted);
      setVisibility('embeddedTitle', embedded);
      setVisibility('walletTitle', wallets);
      setVisibility('apiTitle', endpoints);
      setVisibility('webhookTitle', webhooks);
    }

    function formatDate(date) {

      return `${String(date.getMonth() + 1).padStart(2, '0')}/${
        String(date.getDate()).padStart(2, '0')
      }/${date.getFullYear()}`;
    }

    function getSelectedSections() {

      const sections = [];

      if (hosted.length) {
        sections.push({
          name: 'Hosted Payment Form Options',
          items: hosted
        });
      }

      if (embedded.length) {
        sections.push({
          name: 'Embedded Payment Options',
          items: embedded
        });
      }

      if (wallets.length) {
        sections.push({
          name: 'Digital Wallet Options',
          items: wallets
        });
      }

      if (endpoints.length) {
        sections.push({
          name: 'API Endpoints',
          items: endpoints
        });
      }

      if (webhooks.length) {
        sections.push({
          name: 'Webhook Options',
          items: webhooks
        });
      }

      return sections;
    }

    // =========================
    // BUILD UI
    // =========================

    const container = document.getElementById('sections');

    function buildSection(title, options, arr) {

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.textContent = title;

      details.appendChild(summary);

      const buttonGroup = document.createElement('div');
      buttonGroup.classList.add('button-group');

      options.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {

          toggleSelection(arr, opt);

          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      details.appendChild(buttonGroup);
      container.appendChild(details);
    }

    buildSection(
      'Hosted Payment Form Options',
      hostedOptions,
      hosted
    );

    buildSection(
      'Embedded Payment Options',
      embeddedOptions,
      embedded
    );

    buildSection(
      'Digital Wallet Options',
      walletOptions,
      wallets
    );

    // =========================
    // API DROPDOWNS
    // =========================

    const apiDetails = document.createElement('details');

    const apiSummary = document.createElement('summary');
    apiSummary.textContent = 'API Endpoints';

    apiDetails.appendChild(apiSummary);

    const apiContainer = document.createElement('div');
    apiContainer.style.paddingLeft = '20px';

    Object.entries(apiGroups).forEach(([groupName, groupOptions]) => {

      const details = document.createElement('details');

      const summary = document.createElement('summary');
      summary.textContent = groupName;

      details.appendChild(summary);

      const buttonGroup = document.createElement('div');

      groupOptions.forEach(opt => {

        const btn = document.createElement('button');
        btn.textContent = opt;

        btn.addEventListener('click', () => {

          toggleSelection(endpoints, opt);

          btn.classList.toggle('selected');
        });

        buttonGroup.appendChild(btn);
      });

      details.appendChild(buttonGroup);
      apiContainer.appendChild(details);
    });

    apiDetails.appendChild(apiContainer);
    container.appendChild(apiDetails);

    // =========================
    // WEBHOOK OPTIONS
    // =========================

    buildSection(
      'Webhook Options',
      webhookOptions,
      webhooks
    );

    renderSelections();

    // =========================
    // VALIDATION SHEET
    // =========================

    document.getElementById('exportBtn')
      .addEventListener('click', async () => {

      const partnerName =
        document.getElementById('partnerName')
        .value
        .trim();

      const wb = new ExcelJS.Workbook();

      const ws = wb.addWorksheet('Validation Sheet');

      ws.columns = [
        { width: 30 },
        { width: 30 },
        { width: 30 }
      ];

      const headerStyle = {
        font: {
          bold: true,
          color: { argb: 'FFFFFFFF' }
        },

        fill: {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'E60000' }
        },

        alignment: {
          horizontal: 'center'
        }
      };

      const addSection = (
        header,
        arr,
        cols = 2
      ) => {

        if (ws.lastRow) {
          ws.addRow([]);
        }

        const headerRow = ws.addRow(header);

        for (let i = 1; i <= header.length; i++) {

          const cell = headerRow.getCell(i);

          cell.font = headerStyle.font;
          cell.fill = headerStyle.fill;
          cell.alignment = headerStyle.alignment;
        }

        arr.forEach(v => {

          ws.addRow([
            v,
            ...(Array(cols - 1).fill(''))
          ]);
        });
      };

      if (hosted.length) {
        addSection(
          ['Hosted Payment Form', 'Response Data'],
          hosted
        );
      }

      if (embedded.length) {
        addSection(
          ['Embedded Payments', 'JWT', 'Response Data'],
          embedded,
          3
        );
      }

      if (wallets.length) {
        addSection(
          ['Digital Wallets', 'Response Data'],
          wallets
        );
      }

      if (endpoints.length) {
        addSection(
          ['API Endpoints', 'Request Data', 'Response Data'],
          endpoints,
          3
        );
      }

      addSection(
        ['Webhook Options', 'Subscribed? (Y/N)'],
        webhookOptions
      );

      addSection(
        ['Fee Type', 'Using? (Y/N)'],
        feeOptions
      );

      const buf = await wb.xlsx.writeBuffer();

      const blob = new Blob(
        [buf],
        {
          type:
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
      );

      const fileName = partnerName
        ? `${partnerName.replaceAll(' ', '-')}-Validation-Sheet.xlsx`
        : 'Validation-Sheet.xlsx';

      saveAs(blob, fileName);
    });

    // =========================
    // ONBOARDING SHEET
    // =========================

    document.getElementById('onboardingBtn')
      .addEventListener('click', async () => {

      const partnerName =
        document.getElementById('partnerName')
        .value
        .trim();

      const wb = new ExcelJS.Workbook();

      const ws = wb.addWorksheet('Onboarding Sheet');

      ws.columns = [
        { width: 30 },
        { width: 30 },
        { width: 30 }
      ];

      const headerStyle = {
        font: {
          bold: true,
          color: { argb: 'FFFFFFFF' }
        },

        fill: {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'E60000' }
        },

        alignment: {
          horizontal: 'center'
        }
      };

      const headerRow = ws.addRow([
        'Onboarding Endpoint',
        'Request Data',
        'Response Data'
      ]);

      for (let i = 1; i <= 3; i++) {

        const cell = headerRow.getCell(i);

        cell.font = headerStyle.font;
        cell.fill = headerStyle.fill;
        cell.alignment = headerStyle.alignment;
      }

      onboardingOptions.forEach(v => {
        ws.addRow([v, '', '']);
      });

      const buf = await wb.xlsx.writeBuffer();

      const blob = new Blob(
        [buf],
        {
          type:
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
      );

      const fileName = partnerName
        ? `${partnerName.replaceAll(' ', '-')}-Onboarding-Sheet.xlsx`
        : 'Onboarding-Sheet.xlsx';

      saveAs(blob, fileName);
    });

    // =========================
    // VALIDATION LETTER
    // =========================

    document.getElementById('letterBtn')
      .addEventListener('click', async () => {

      const partnerName =
        document.getElementById('partnerName')
          .value
          .trim() || 'Partner';

      const reviewerName =
        document.getElementById('reviewerName')
          .value
          .trim() || 'Reviewer';

      const today = formatDate(new Date());

      const sections = getSelectedSections();

      const BASE_SIZE = 22;
      const HEADING_SIZE = 40;

      const baseText = (text, opts = {}) =>
        new docx.TextRun({
          text,
          font: "Aptos",
          size: BASE_SIZE,
          ...opts
        });

      const headingText = (text, opts = {}) =>
        new docx.TextRun({
          text,
          font: "Aptos Display",
          size: HEADING_SIZE,
          bold: true,
          ...opts
        });

      const signatureText = (text, opts = {}) =>
        new docx.TextRun({
          text,
          font: "Aptos",
          size: 22,
          ...opts
        });

      const para = (content, line = 240, opts = {}) =>
        new docx.Paragraph({
          spacing: {
            line,
            ...opts.spacing
          },
          ...opts,
          children: content
        });

      const children = [];

      // =========================
      // HEADER
      // =========================

      const logoImage = await fetch("./assets/logo.png").then(r => r.arrayBuffer());

      children.push(
        para(
          [
            headingText("DPP Validation Letter"),
            new docx.TextRun("\t"),
            new docx.ImageRun({
              data: logoImage,
              transformation: {
                width: 120,
                height: 40
              }
            })
          ],
          240,
          {
            tabStops: [
              {
                type: docx.TabStopType.RIGHT,
                position: docx.TabStopPosition.MAX
              }
            ]
          }
        )
      );

      children.push(
        new docx.Paragraph({
          spacing: { line: 240 },
          border: {
            bottom: {
              color: "000000",
              style: docx.BorderStyle.SINGLE,
              size: 6,
              space: 1
            }
          },
          children: [new docx.TextRun("")]
        })
      );

      children.push(para([], 360));

      children.push(
        para([
          signatureText("Date: ", { bold: true }),
          signatureText(today)
        ])
      );

      children.push(para([], 240));

      children.push(
        para([
          baseText("Partner Name: ", { bold: true }),
          baseText(partnerName)
        ])
      );

      children.push(para([], 360));

      const normalizeProductName = (name) => {
        return name
          .replace(/Hosted Payment Form options?/i, "Hosted Payment Form")
          .replace(/Embedded Payment Options?/i, "Embedded Payments")
          .replace(/Digital Wallet Options?/i, "Digital Wallets")
          .replace(/API Endpoints?/i, "DPP Experience API")
          .replace(/Webhook Options?/i, "Webhooks");
      };

      const normalizedProducts = sections.map(s =>
        normalizeProductName(s.name)
      );

      children.push(
        para([
          baseText("Product(s): ", { bold: true }),
          baseText(normalizedProducts.join(', '))
        ])
      );

      children.push(
        para([
          baseText("Gateway: ", { bold: true }),
          baseText("DPP")
        ])
      );

      children.push(para([], 360));

      // =========================
      // FEATURES
      // =========================

      children.push(
        para([
          baseText("Features", { bold: true })
        ])
      );

      sections.forEach(section => {

        const cleanTitle = normalizeProductName(section.name);

        children.push(
          para(
            [
              baseText(`• ${cleanTitle}`, { bold: true })
            ],
            240,
            {
              spacing: { before: 240 }
            }
          )
        );

        section.items.forEach((item, idx) => {

          children.push(
            para(
              [
                baseText(`- ${item}`)
              ],
              240,
              {
                indent: { left: 720 },
                spacing: {
                  after: idx === section.items.length - 1 ? 120 : 40
                }
              }
            )
          );

        });

      });

      children.push(para([], 360));

      children.push(
        para([
          baseText("Confirmed all operations have been implemented and run successfully.")
        ],
        240,
        { spacing: { after: 120 } })
      );

      children.push(
        para([
          baseText(
            `The signed below has verified that ${partnerName} has completed and passed the First American Payment Systems by Deluxe validation process.`
          )
        ],
        240,
        { spacing: { after: 180 } })
      );

      children.push(
        para([
          baseText(
            "Please note that the analysis performed was a limited test and that it remains the responsibility of the developer to ensure that all current and future required data elements are supplied for interchange compliance. The developer must also ensure that the full and unaltered contents of the payment data are transmitted in each request message."
          )
        ],
        240,
        { spacing: { after: 180 } })
      );

      // =========================
      // SIGNATURE
      // =========================

      children.push(
        para([
          signatureText("Validated by,", { bold: true })
        ],
        240,
        { spacing: { after: 180 } })
      );

      children.push(
        para([
          signatureText(reviewerName, { color: "FF0000", bold: true })
        ],
        240,
        { spacing: { after: 120 } })
      );

      children.push(
        para([
          signatureText("Software Development Analyst")
        ],
        240,
        { spacing: { after: 180 } })
      );

      // =========================
      // DELUXE IMAGE
      // =========================

      const deluxeImage = await fetch("./assets/deluxe.png")
        .then(r => r.arrayBuffer());

      children.push(
        para([
          new docx.ImageRun({
            data: deluxeImage,
            transformation: {
              width: 144,
              height: 32
            }
          })
        ])
      );

      const doc = new docx.Document({
        sections: [
          {
            properties: {},
            children
          }
        ]
      });

      const blob = await docx.Packer.toBlob(doc);

      saveAs(
        blob,
        `${partnerName.replaceAll(' ', '-')}-Validation-Sheet.docx`
      );
    });

  </script>

</body>
</html>
